[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtoc"
version = "0.1.0"
description = "Generate or refresh a table of contents in a Markdown file, in place, with GitHub-compatible anchors."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/mdtoc"

[project.scripts]
mdtoc = "mdtoc:main"

[tool.setuptools]
py-modules = ["mdtoc"]
